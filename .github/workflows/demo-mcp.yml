name: demo-mcp deploy
# Deploys the read-only remote demo MCP (remote-demo/) to its workers.dev test address. Manual only, only from main.
# Runs in the GitHub Environment `demo-mcp`: its branch policy (main only), required reviewer and the secrets
# CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID are set by the owner (see remote-demo/README.md); without them it fails.
# No custom domain until the v2 release (owner decision 07.10).
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: demo-mcp-deploy
  cancel-in-progress: false
jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    environment: demo-mcp
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test packages/aindf-kit/test/*.test.mjs remote-demo/*.test.mjs
      - run: npx --yes wrangler@4.148.0 deploy --config remote-demo/wrangler.jsonc
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
