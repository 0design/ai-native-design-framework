name: public-text
# This repository is public: its text describes the code and nothing about how the work is organized.
# Pull request: the title and description, the added lines and the commit messages. Push to main: the whole tree.
on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  public-text:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test scripts/test/public-text-check.test.mjs
      - name: Pull request text
        if: github.event_name == 'pull_request'
        run: node scripts/public-text-check.mjs --pr "$BASE_SHA" "$HEAD_SHA"
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      - name: Tree
        if: github.event_name == 'push'
        run: node scripts/public-text-check.mjs --tree
