name: kit
on:
  pull_request:
    paths: ['packages/aindf-kit/**', 'examples/**', 'plugin/**', '.claude-plugin/**', 'remote-demo/**', '.github/workflows/kit.yml']
  push:
    branches: [main]
    paths: ['packages/aindf-kit/**', 'examples/**', 'plugin/**', '.claude-plugin/**', 'remote-demo/**', '.github/workflows/kit.yml']
permissions:
  contents: read
jobs:
  test:
    # public repo: GitHub-hosted only — a self-hosted runner would run fork PR code on our machine
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test packages/aindf-kit/test/*.test.mjs
  clean-install:
    # pack the kit, install the tarball into an empty project and use it only as a consumer would (bin, exports, MCP)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: node packages/aindf-kit/scripts/clean-install.mjs
  demo-examples:
    # the three working examples of the demo design system, through `aindf mcp` over stdio
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node examples/demo-ds/examples.mjs
  remote-demo:
    # the remote demo MCP Worker: behaviour in Node, then a Wrangler build without deploying (no credentials needed)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test remote-demo/*.test.mjs
      - run: npx --yes wrangler@4.148.0 deploy --dry-run --outdir /tmp/aindf-demo-mcp --config remote-demo/wrangler.jsonc
  registry-manifest:
    # server.json against the official MCP Registry schema (the version its $schema names)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - env:
          SCHEMA_URL: https://static.modelcontextprotocol.io/schemas/2025-12-11/server.schema.json # pinned; package.test checks server.json names it
        run: |
          curl -sfL "$SCHEMA_URL" -o /tmp/server.schema.json
          npx --yes -p ajv-cli@5 -p ajv-formats@2 ajv validate --spec=draft7 --strict=false -c ajv-formats -s /tmp/server.schema.json -d packages/aindf-kit/server.json
  plugin:
    # the plugin as Claude Code starts it: copies, manifest, MCP entry, server; then the official validator
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node plugin/scripts/check.mjs
      - run: npx --yes "@anthropic-ai/claude-code@$CLAUDE_CODE_VERSION" --version && npx --yes "@anthropic-ai/claude-code@$CLAUDE_CODE_VERSION" plugin validate --strict plugin && npx --yes "@anthropic-ai/claude-code@$CLAUDE_CODE_VERSION" plugin validate --strict .
        env:
          CLAUDE_CODE_VERSION: 2.1.292 # pinned; raise on purpose
