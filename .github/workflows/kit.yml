name: kit
on:
  pull_request:
    paths: ['packages/aindf-kit/**', 'examples/**', 'plugin/**', '.github/workflows/kit.yml']
  push:
    branches: [main]
    paths: ['packages/aindf-kit/**', 'examples/**', 'plugin/**', '.github/workflows/kit.yml']
permissions:
  contents: read
jobs:
  test:
    # public repo: GitHub-hosted only — a self-hosted runner would run fork PR code on our machine
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test packages/aindf-kit/test/*.test.mjs
  clean-install:
    # pack the kit, install the tarball into an empty project and use it only as a consumer would (bin, exports, MCP)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: node packages/aindf-kit/scripts/clean-install.mjs
  demo-examples:
    # the three working examples of the demo design system, through `aindf mcp` over stdio
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node examples/demo-ds/examples.mjs
  plugin:
    # the plugin as Claude Code starts it: copies, manifest, MCP entry, server; then the official validator
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node plugin/scripts/check.mjs
      - run: npx --yes @anthropic-ai/claude-code@latest --version && npx --yes @anthropic-ai/claude-code@latest plugin validate --strict plugin
